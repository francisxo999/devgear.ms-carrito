services:
  db-carrito:
    image: mysql:8.0
    container_name: mysql-carrito
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carrito_db
    ports:
      - "3307:3306"
    volumes:
      - db_carrito_data:/var/lib/mysql

  app-carrito:
    build: .
    container_name: devgear-ms-carrito-1
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - db-carrito
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-carrito:3306/carrito_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  db_carrito_data:
